name: ETF Dividend Collect

on:
  schedule:
    - cron: '0 9 * * *'  # 매일 18:00 KST (09:00 UTC)
  workflow_dispatch:
    inputs:
      insert_months:
        description: '공시에만 있는 분배금을 넣을 기간 (개월). 과거 소급은 크게 주세요'
        required: false
        default: '2'

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: collector/etf-dividend/requirements.txt

      - name: Install Python dependencies
        run: pip install -r collector/etf-dividend/requirements.txt

      - name: Install Playwright Chromium
        run: playwright install chromium --with-deps

      # --apply       : 기존 행을 공시값으로 맞춘다 (기준일 포함)
      # --insert-months: 공시에만 있는 신규를 이 기간 안에서만 넣는다.
      #                  제한이 없으면 069500 의 2003년 이후 전체가 매일 쌓이려 한다.
      - name: Run ETF dividend collector
        env:
          PENSION_SIM_DB_HOST:     ${{ secrets.PENSION_SIM_DB_HOST }}
          PENSION_SIM_DB_PORT:     ${{ secrets.PENSION_SIM_DB_PORT }}
          PENSION_SIM_DB_NAME:     ${{ secrets.PENSION_SIM_DB_NAME }}
          PENSION_SIM_DB_USER:     ${{ secrets.PENSION_SIM_DB_USER }}
          PENSION_SIM_DB_PASSWORD: ${{ secrets.PENSION_SIM_DB_PASSWORD }}
          PYTHONIOENCODING: utf-8
        run: python main.py --apply --insert-months "${{ github.event.inputs.insert_months || 2 }}"
        working-directory: collector/etf-dividend
